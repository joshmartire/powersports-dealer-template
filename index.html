<style>
/* Layout: dark shop-floor base, slanted orange "decal" cuts, inventory-first. Single dark look by design (powersports). */
:root{
  --bg:#0d0e0f; --bg-2:#141618; --panel:#1a1d20; --panel-2:#212428; --line:#2c3035; --line-2:#3b4047;
  --fg:#eeebe6; --fg-2:#c9c5be; --muted:#8f949b;
  --accent:#ff6a13; --accent-2:#ff8a45; --accent-ink:#170900;
  --khaki:#b9a174;
  --ok:#3ec46d; --warn:#f2b632; --bad:#ef5350; --info:#5aa7e6;
  --f-display:'Saira Condensed','Arial Narrow',Impact,sans-serif;
  --f-body:'Barlow','Helvetica Neue',Arial,sans-serif;
  --f-label:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif;
  --r:4px; --accent-txt:#ff8a45;
  color-scheme:dark;
}
/* Public website: light dealer look. The dealer portal keeps the dark tokens above. */
body.public{--bg:#ffffff;--bg-2:#f3f4f6;--panel:#ffffff;--panel-2:#f3f4f6;--line:#e3e5e8;--line-2:#cfd3d8;--fg:#1d1d1d;--fg-2:#454c56;--muted:#6b7280;--accent-txt:#c24806;color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.display{font-family:var(--f-display);font-weight:900;text-transform:uppercase;line-height:.92;letter-spacing:.005em;text-wrap:balance}
.lean{display:inline-block;transform:skewX(-8deg)}
.label{font-family:var(--f-label);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.hl{color:var(--accent)}

/* Buttons */
.btn{--cut:10px;display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:0;cursor:pointer;text-decoration:none;
  font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:1rem;line-height:1;
  padding:.95em 1.6em;background:var(--accent);color:var(--accent-ink);
  clip-path:polygon(var(--cut) 0,100% 0,calc(100% - var(--cut)) 100%,0 100%);transition:background .15s,transform .15s}
.btn:hover{background:var(--accent-2)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{clip-path:none}
.btn.dark{background:var(--fg);color:var(--bg)}
.btn.dark:hover{background:#fff}
.btn.sm{font-size:.85rem;padding:.75em 1.2em;--cut:7px}
.btn-line{display:inline-flex;align-items:center;justify-content:center;gap:.45em;cursor:pointer;text-decoration:none;background:transparent;
  border:1.5px solid var(--line-2);color:var(--fg);border-radius:var(--r);padding:.7em 1.1em;font-family:var(--f-label);font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;font-size:.82rem;line-height:1;transition:border-color .15s,background .15s}
.btn-line:hover{border-color:var(--accent);background:rgba(255,106,19,.08)}
.btn-line.sm{padding:.5em .75em;font-size:.74rem}
.btn-line.danger:hover{border-color:var(--bad);background:rgba(239,83,80,.1)}
.icon{width:1.1em;height:1.1em;flex:none}

/* Promo + header */
.promo{background:var(--accent);color:var(--accent-ink);font-family:var(--f-label);font-weight:700;font-size:.86rem;letter-spacing:.04em;position:relative;z-index:51}
.promo .wrap{display:flex;gap:16px;align-items:center;justify-content:space-between;padding-block:7px;flex-wrap:wrap}
.promo a{font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.76rem;text-underline-offset:3px}
.site-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line);transition:background .25s,border-color .25s,box-shadow .25s}
.site-head.solid{box-shadow:0 6px 20px rgba(0,0,0,.08)}
.head-top .wrap{display:flex;align-items:center;gap:24px;height:74px}
.head-info{margin-left:auto;display:flex;align-items:center;gap:22px}
.addr{font-size:.82rem;line-height:1.3;color:var(--fg-2);text-decoration:none}
.addr b{display:block;color:var(--fg);font-weight:700}
.addr span{color:var(--accent-txt);font-weight:700}
.head-search{display:flex;align-items:center;border:1.5px solid var(--line-2);border-radius:999px;overflow:hidden;background:var(--bg-2)}
.head-search input{border:0;background:none;padding:9px 4px 9px 16px;width:210px;color:var(--fg);min-width:0}
.head-search input:focus{outline:none}
.head-search:focus-within{border-color:var(--accent)}
.head-search button{border:0;background:none;padding:8px 14px 8px 8px;cursor:pointer;color:var(--fg-2);display:grid;place-items:center}
.head-nav{border-top:1px solid var(--line)}
.head-nav .wrap{display:flex;align-items:center;height:48px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:4px;flex:1}
.nav > a,.nav .drop > button{font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.84rem;white-space:nowrap;
  text-decoration:none;padding:12px 10px;background:none;border:0;cursor:pointer;color:var(--fg);display:flex;align-items:center;gap:4px}
.nav > a:hover,.nav .drop > button:hover{color:var(--accent-txt)}
.nav > a[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--accent)}
.drop{position:relative}
.drop-menu{position:absolute;top:100%;left:0;min-width:270px;background:#fff;color:#1d1d1d;border:1px solid #e3e5e8;border-top:3px solid var(--accent);
  padding:8px;display:none;flex-direction:column;box-shadow:0 20px 40px rgba(0,0,0,.18)}
.drop:hover .drop-menu,.drop:focus-within .drop-menu{display:flex}
.drop-menu a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;text-decoration:none;border-radius:var(--r);font-weight:600;color:#1d1d1d}
.drop-menu a:hover{background:#f3f4f6}
.drop-menu a span{color:#6b7280;font-size:.85rem;font-variant-numeric:tabular-nums}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none;color:var(--fg)}
.logo svg{width:44px;height:38px}
.logo b{font-family:var(--f-display);font-weight:900;font-size:1.7rem;text-transform:uppercase;line-height:.85;letter-spacing:.01em;display:block;transform:skewX(-8deg)}
.logo small{display:block;font-family:var(--f-label);font-weight:600;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.phone{font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:.02em;text-decoration:none;display:flex;align-items:center;gap:8px;color:var(--fg)}
.phone .icon{color:var(--accent)}
.menu-btn{display:none;background:none;border:1.5px solid var(--line-2);border-radius:var(--r);width:44px;height:44px;cursor:pointer;align-items:center;justify-content:center;color:var(--fg)}
.mobile-nav{display:none;border-top:1px solid var(--line);background:var(--bg)}
.mobile-nav .wrap{display:grid;gap:2px;padding-block:12px}
.mobile-nav a{padding:12px 4px;text-decoration:none;font-weight:600;border-bottom:1px solid var(--line);color:var(--fg)}
.mobile-nav form{margin-bottom:8px}
.mobile-nav .head-search input{width:100%}
.site-head.open .mobile-nav{display:block}
/* Transparent over the home hero until scrolled */
.site-head.over:not(.solid):not(.open){background:transparent;border-color:rgba(255,255,255,.14)}
.site-head.over:not(.solid):not(.open) .head-nav{border-color:rgba(255,255,255,.14)}
.site-head.over:not(.solid):not(.open) :is(.logo,.addr,.addr b,.phone,.nav > a,.nav .drop > button,.menu-btn){color:#fff}
.site-head.over:not(.solid):not(.open) .logo small{color:rgba(255,255,255,.7)}
.site-head.over:not(.solid):not(.open) .addr span{color:var(--accent)}
.site-head.over:not(.solid):not(.open) .menu-btn{border-color:rgba(255,255,255,.4)}
.site-head.over:not(.solid):not(.open) .head-search{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3)}
.site-head.over:not(.solid):not(.open) .head-search :is(input,button){color:#fff}
.site-head.over:not(.solid):not(.open) .head-search input::placeholder{color:rgba(255,255,255,.7)}
@media (max-width:1060px){.head-nav,.head-info .addr,.head-info .head-search{display:none}.menu-btn{display:inline-flex}}
@media (max-width:520px){.phone span{display:none}.logo small{display:none}.head-top .wrap{height:64px}}
.trade-tab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:40;background:var(--accent);color:var(--accent-ink);text-decoration:none;
  writing-mode:vertical-rl;padding:18px 10px;padding-right:calc(10px + env(safe-area-inset-right,0px));font-family:var(--f-display);font-weight:800;text-transform:uppercase;
  letter-spacing:.08em;font-size:1rem;border-radius:6px 0 0 6px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.trade-tab:hover{background:var(--accent-2)}
@media (max-width:700px){.trade-tab{top:auto;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:none;writing-mode:horizontal-tb;padding:11px 14px;padding-right:calc(14px + env(safe-area-inset-right,0px));font-size:.85rem}}

/* Hero: dusk field, 3D quad, transparent header over it */
.hero{position:relative;overflow:hidden;color:#fff;margin-top:calc(-1 * var(--head-h,123px));padding-top:var(--head-h,123px);
  background:radial-gradient(ellipse 55% 40% at 70% 70%,rgba(255,140,60,.5),transparent 70%),
    linear-gradient(180deg,#0a0e13 0%,#141920 32%,#2b211f 56%,#73361b 76%,#c8642a 90%,#e5873a 100%)}
.hero #dust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.hero .land{position:absolute;left:0;right:0;bottom:0;width:100%;height:44%;z-index:1;display:block}
.hero .wrap{position:relative;z-index:3;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;align-items:end;min-height:min(78vh,740px);padding-block:40px 112px}
.hero-copy{align-self:center;padding-bottom:30px}
.hero .label{color:rgba(255,255,255,.72)}
.hero h1{font-size:clamp(3rem,6.8vw,6.1rem);margin:12px 0 18px;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.35)}
.hero h1 .hl{display:block;color:var(--accent)}
.hero p.lede{font-size:1.15rem;color:rgba(255,255,255,.86);max-width:32em;margin:0 0 26px}
.hero-ctas{display:flex;gap:10px;flex-wrap:wrap}
.btn-w{display:inline-flex;align-items:center;justify-content:center;gap:.5em;text-decoration:none;border:2px solid rgba(255,255,255,.75);color:#fff;background:rgba(0,0,0,.15);
  font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:1rem;line-height:1;padding:.85em 1.4em;border-radius:2px}
.btn-w:hover{background:#fff;color:#111}
.hero-art{position:relative;min-width:0;align-self:end;margin-bottom:-26px}
.hero-art .ride{position:relative;transform-origin:50% 92%}
.hero-art .ride svg,.hero-art .ride img{position:relative;width:100%;height:auto;display:block;filter:drop-shadow(0 24px 30px rgba(0,0,0,.55))}
.hero-art .tag{position:absolute;right:4%;top:0;z-index:2;background:#111;color:#fff;border:1px solid rgba(255,255,255,.18);padding:10px 14px;transform:skewX(-8deg)}
.hero-art .tag b{display:block;font-family:var(--f-display);font-size:1.6rem;line-height:1;font-weight:800}
.hero-art .tag .label{color:var(--accent)}
.hero .ride.svg-drive{animation:driveIn 1s cubic-bezier(.12,.85,.25,1) both}
.hero .ride.waiting svg{visibility:hidden}
.hero .ride canvas{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;transition:opacity .45s ease;pointer-events:none}
.hero .ride.has3d canvas{opacity:1}
.hero .ride.has3d svg{visibility:hidden}
.hero.intro h1 .lean{animation:slam .45s cubic-bezier(.2,.9,.3,1.25) .35s both}
.hero.intro h1 .lean + .lean{animation-delay:.52s}
.hero.intro .hero-copy > .label{animation:fadeUp .4s ease-out .1s both}
.hero.intro .lede,.hero.intro .hero-ctas{animation:fadeUp .45s ease-out .65s both}
.hero.intro .hero-art .tag{animation:pop .35s cubic-bezier(.2,.9,.3,1.4) 1.1s both}
@keyframes driveIn{0%{transform:translateX(115%);filter:blur(7px)}55%{transform:translateX(-4%) rotate(-2.6deg);filter:blur(0)}72%{transform:translateX(1%) rotate(1.1deg)}86%{transform:translateX(0) rotate(-.4deg)}100%{transform:none;filter:none}}
@keyframes slam{from{opacity:0;transform:skewX(-8deg) translateX(-70px) scale(1.08)}to{opacity:1;transform:skewX(-8deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:skewX(-8deg) scale(.7)}to{opacity:1;transform:skewX(-8deg)}}
@media (max-width:980px){.hero .wrap{grid-template-columns:1fr;min-height:0;padding-block:28px 116px}.hero-copy{padding-bottom:0}.hero-art{max-width:620px;width:100%;margin:0 auto -18px}}

/* Shop-by-type picker overlapping the hero */
.types{position:relative;z-index:5;margin-top:-74px}
.type-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.type-tabs button{text-align:center;padding:14px 10px 12px;border:0;cursor:pointer;background:rgba(18,20,23,.74);backdrop-filter:blur(6px);color:#fff;border-radius:6px 6px 0 0;display:grid;gap:3px}
.type-tabs button b{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:1.4rem;line-height:1}
.type-tabs button span{font-family:var(--f-label);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:600}
.type-tabs button:hover{background:rgba(18,20,23,.9)}
.type-tabs button[aria-selected="true"]{background:var(--panel);color:var(--fg)}
.type-tabs button[aria-selected="true"] b{color:var(--fg)}
.type-panel{background:var(--panel);box-shadow:0 18px 40px rgba(0,0,0,.1);border:1px solid var(--line);border-top:0;padding:18px 24px 26px;border-radius:0 0 6px 6px}
.type-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.type-head p{margin:0;color:var(--fg-2)}
.type-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;align-items:end}
.type-item{display:grid;justify-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.type-item svg{width:100%;max-width:310px;height:auto;transition:transform .3s}
.type-item img{width:100%;max-width:300px;aspect-ratio:5/3;object-fit:contain;filter:drop-shadow(0 12px 10px rgba(0,0,0,.18));transition:transform .3s}
.type-item:hover :is(svg,img){transform:translateY(-4px) scale(1.03)}
.go-pill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line-2);border-radius:999px;padding:8px 15px;font-family:var(--f-label);font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;color:var(--fg);text-decoration:none;background:var(--panel);transition:background .15s,border-color .15s,color .15s}
.type-item:hover .go-pill,a.go-pill:hover{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
@media (max-width:700px){.hero .wrap{padding-bottom:64px}.hero-art{margin-bottom:0}.hero-art .tag{display:none}.type-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.type-tabs button{border-radius:6px}.types{margin-top:-28px}.type-panel{border-top:1px solid var(--line);margin-top:6px;border-radius:6px;padding:16px}}

.fin-strip{background:var(--accent);color:var(--accent-ink)}
.fin-strip .wrap{display:flex;align-items:center;gap:24px;justify-content:space-between;padding-block:26px;flex-wrap:wrap}
.fin-strip h3{margin:0;font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:clamp(1.6rem,3vw,2.2rem);line-height:1}
.fin-strip p{margin:6px 0 0;max-width:46em}
.promos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.promo-card{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--panel);text-decoration:none;color:var(--fg);overflow:hidden;transition:transform .2s,box-shadow .2s;min-width:0}
.promo-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.08)}
.promo-card .big{position:relative;overflow:hidden;background:#16181b;color:#fff;padding:22px 18px 20px;font-family:var(--f-display);font-weight:900;font-size:2.7rem;line-height:.9;text-transform:uppercase}
.promo-card .big small{display:block;font-family:var(--f-label);font-size:.72rem;letter-spacing:.14em;color:var(--accent);margin-bottom:8px;font-weight:700}
.promo-card .big > span{position:relative;z-index:1}
.promo-card .big::after{content:"";position:absolute;right:-34px;top:0;bottom:0;width:72px;background:var(--accent);transform:skewX(-18deg);opacity:.9}
.promo-card .txt{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.promo-card h4{margin:0;font-weight:700;font-size:1.05rem;line-height:1.25}
.promo-card p{margin:0;color:var(--fg-2);font-size:.92rem}
.promo-card .ends{margin-top:auto;padding-top:10px;font-family:var(--f-label);font-weight:600;font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
@media (max-width:1000px){.promos{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.promos{grid-template-columns:1fr}}
.brand-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.brand-row span{display:grid;place-items:center;height:76px;border:1px solid var(--line);background:var(--bg-2);font-family:var(--f-display);font-weight:800;font-size:1.4rem;text-transform:uppercase;color:#4b525b;letter-spacing:.02em}
@media (max-width:700px){.brand-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 48px) / 4);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail > *{scroll-snap-align:start}
@media (max-width:1100px){.rail{grid-auto-columns:calc((100% - 32px) / 3)}}
@media (max-width:800px){.rail{grid-auto-columns:calc((100% - 16px) / 2)}}
@media (max-width:540px){.rail{grid-auto-columns:86%}}
.rail-btns{display:flex;gap:8px;align-items:center}
.rail-btns button{width:44px;height:44px;border:1.5px solid var(--line-2);background:var(--panel);cursor:pointer;display:grid;place-items:center;border-radius:50%;color:var(--fg)}
.rail-btns button:hover{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:44px;align-items:center}
.about-media{position:relative;aspect-ratio:4/3;max-width:100%;background:radial-gradient(ellipse at 70% 90%,rgba(255,140,60,.35),transparent 60%),linear-gradient(160deg,#22272d,#111316);overflow:hidden;border-radius:4px}
.about-media::before{content:"";position:absolute;left:-10%;right:-10%;bottom:0;height:24%;background:#0b0c0d}
.about-media::after{content:"";position:absolute;top:0;bottom:0;left:56%;width:16%;background:var(--accent);transform:skewX(-14deg);opacity:.85}
.about-media img{position:absolute;z-index:1;height:auto;filter:drop-shadow(0 18px 16px rgba(0,0,0,.45))}
.about-media .am-a{left:-3%;bottom:7%;width:70%}
.about-media .am-b{right:-2%;bottom:3%;width:50%;z-index:2}
.about h2{font-size:clamp(2rem,4vw,3.1rem);margin:8px 0 16px}
.about p{color:var(--fg-2);max-width:60ch;margin:0 0 14px}
.about .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
@media (max-width:900px){.about{grid-template-columns:1fr;gap:24px}}

/* Sections */
section.block{padding-block:72px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(2.2rem,4.5vw,3.4rem);margin:6px 0 0}
.sec-head a{font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.85rem;text-decoration:none;color:var(--accent-txt);display:flex;gap:6px;align-items:center}

/* Category tiles */
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cat{position:relative;display:grid;grid-template-columns:1fr auto;align-items:end;text-decoration:none;background:var(--panel);border:1px solid var(--line);
  padding:18px 20px;min-height:200px;overflow:hidden;transition:border-color .2s}
.cat svg{position:absolute;right:-6%;top:6%;width:72%;height:auto;opacity:.95;transition:transform .35s}
.cat .t{position:relative}
.cat .t b{font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:2rem;line-height:.95;display:block}
.cat .t span{color:var(--muted);font-family:var(--f-label);font-weight:600;letter-spacing:.06em}
.cat .go{position:relative;width:42px;height:42px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line-2);transition:background .2s,color .2s}
.cat::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--accent);transition:width .3s}
.cat:hover{border-color:var(--line-2)}
.cat:hover::after{width:100%}
.cat:hover svg{transform:translateX(-10px)}
.cat:hover .go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (max-width:860px){.cats{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.cats{grid-template-columns:1fr}.cat{min-height:170px}}

/* Unit cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);text-decoration:none;transition:border-color .2s,transform .2s;min-width:0}
.card:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:0 14px 30px rgba(0,0,0,.08)}
.media{position:relative;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 88%,#d9dde2 0%,#f1f3f5 62%,#f7f8f9 100%)}
.media svg{position:absolute;inset:8% 6% 2%;width:88%;height:90%}
.media img{width:100%;height:100%;object-fit:cover}
.media img.cut,.gallery .main img.cut{object-fit:contain;padding:5% 6% 3%;filter:drop-shadow(0 14px 12px rgba(0,0,0,.22))}
.thumbs img.cut,.inv-t .thumb img.cut,.ph img.cut{object-fit:contain;padding:4%}
.badges{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.badge{font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.68rem;padding:4px 8px;background:var(--bg);border:1px solid var(--line-2);color:var(--fg)}
.badge.new{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.badge.sale{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.badge.pending{background:var(--warn);color:#1a1200;border-color:var(--warn)}
.ribbon{position:absolute;z-index:3;top:22px;right:-48px;transform:rotate(35deg);background:var(--bad);color:#fff;font-family:var(--f-display);font-weight:900;
  letter-spacing:.2em;font-size:1rem;padding:6px 60px;box-shadow:0 6px 14px rgba(0,0,0,.4)}
.card.is-sold .media > *:not(.ribbon):not(.badges){filter:grayscale(1) brightness(.6)}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.35rem;line-height:1.05;text-transform:uppercase;letter-spacing:.01em}
.card h3 small{display:block;font-family:var(--f-label);font-weight:600;font-size:.78rem;color:var(--muted);letter-spacing:.12em;margin-bottom:2px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.84rem;color:var(--muted);font-family:var(--f-label);font-weight:500}
.price-row{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.price{font-family:var(--f-display);font-weight:800;font-size:1.75rem;line-height:1;color:var(--fg)}
.price.on-sale{color:var(--accent-txt)}
.was{font-size:.85rem;color:var(--muted);text-decoration:line-through;display:block;font-family:var(--f-label)}
.pay{font-size:.78rem;color:var(--muted);text-align:right;font-family:var(--f-label);line-height:1.3}
.pay b{color:var(--fg);font-size:.95rem;display:block}
.empty{padding:48px 24px;border:1px dashed var(--line-2);text-align:center;color:var(--muted)}

/* Banner + split */
.split{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.panel-cta{position:relative;overflow:hidden;padding:36px;border:1px solid var(--line);background:var(--panel);min-height:280px;display:flex;flex-direction:column;justify-content:end;gap:14px}
.panel-cta.orange{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel-cta.orange .label{color:rgba(23,9,0,.7)}
.panel-cta h3{margin:0;font-size:clamp(2rem,4vw,3rem)}
.panel-cta p{margin:0;max-width:30em}
.panel-cta .big{position:absolute;right:-10px;top:-24px;font-family:var(--f-display);font-weight:900;font-size:11rem;line-height:1;opacity:.13;transform:skewX(-8deg)}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.why{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line)}
.why > div{padding:26px 24px;border-right:1px solid var(--line);display:grid;gap:8px;align-content:start}
.why > div:last-child{border-right:0}
.why svg{width:34px;height:34px;color:var(--accent)}
.why h4{margin:4px 0 0;font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:1.35rem;line-height:1}
.why p{margin:0;color:var(--fg-2);font-size:.95rem}
@media (max-width:900px){.why{grid-template-columns:1fr 1fr}.why > div:nth-child(2){border-right:0}.why > div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:520px){.why{grid-template-columns:1fr}.why > div{border-right:0;border-bottom:1px solid var(--line)}}
.brands{display:flex;flex-wrap:wrap;gap:10px 34px;align-items:center;padding-block:26px;border-block:1px solid var(--line)}
.brands span{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:1.5rem;color:var(--muted);letter-spacing:.03em;transform:skewX(-8deg)}
.visit{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.visit > div{background:var(--panel);border:1px solid var(--line);padding:24px;display:grid;gap:10px;align-content:start}
.visit h4{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.4rem;text-transform:uppercase}
.hours{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;font-variant-numeric:tabular-nums;color:var(--fg-2)}
@media (max-width:860px){.visit{grid-template-columns:1fr}}

/* Footer */
.foot{--fg:#eeebe6;--fg-2:#c9c5be;--muted:#8f949b;--line:#2c3035;background:#141618;color:var(--fg);margin-top:60px;border-top:4px solid var(--accent)}
.foot .logo{color:var(--fg)}
.foot .wrap{padding-block:44px 28px;display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:28px}
.foot h5{margin:0 0 10px;font-family:var(--f-label);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;color:var(--muted)}
.foot a{display:block;text-decoration:none;color:var(--fg-2);padding:3px 0}
.foot a:hover{color:var(--fg)}
.foot .fine{grid-column:1/-1;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:.82rem}
.foot .fine a{display:inline;color:var(--muted)}
@media (max-width:860px){.foot .wrap{grid-template-columns:1fr 1fr}}

/* Inventory page */
.page-head{border-bottom:1px solid var(--line);background:var(--bg-2)}
.page-head .wrap{padding-block:34px 26px}
.page-head h1{font-size:clamp(2.4rem,6vw,4.4rem);margin:6px 0 0}
.crumbs{font-family:var(--f-label);font-size:.85rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--fg)}
.cat-strip{display:flex;gap:8px;overflow-x:auto;padding-block:16px 2px;scrollbar-width:thin}
.chip{flex:none;font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;padding:9px 14px;border:1.5px solid var(--line-2);
  background:transparent;cursor:pointer;color:var(--fg-2);text-decoration:none;border-radius:var(--r)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip:hover{border-color:var(--fg-2)}
.inv{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;padding-block:28px 60px}
.filters{display:grid;gap:20px;align-content:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 90px)}
.filters fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
.filters legend{padding:0;margin-bottom:8px}
.check{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:500;color:var(--fg-2)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.check span.c{margin-left:auto;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg button{background:none;border:0;padding:9px 4px;cursor:pointer;font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.8rem;color:var(--fg-2)}
.seg button + button{border-left:1.5px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=range]{width:100%;accent-color:var(--accent)}
.results-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.results-bar b{font-family:var(--f-display);font-size:1.5rem;font-weight:800}
.filter-toggle{display:none}
@media (max-width:900px){
  .inv{grid-template-columns:1fr}
  .filters{position:static;display:none;background:var(--panel);border:1px solid var(--line);padding:18px}
  .filters.show{display:grid}
  .filter-toggle{display:inline-flex}
}

/* Unit detail */
.unit{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:32px;padding-block:28px 40px;align-items:start}
.gallery .main{position:relative;aspect-ratio:16/10;border:1px solid var(--line);overflow:hidden;max-width:100%;background:radial-gradient(ellipse at 50% 88%,#d9dde2 0%,#f1f3f5 62%,#f7f8f9 100%)}
.gallery .main svg{position:absolute;inset:8% 5% 2%;width:90%;height:90%}
.gallery .main img{width:100%;height:100%;object-fit:cover}
.thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:8px}
.thumbs button{padding:0;border:2px solid var(--line);background:var(--panel);aspect-ratio:4/3;overflow:hidden;cursor:pointer}
.thumbs button[aria-current="true"]{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.photo-note{font-size:.82rem;color:var(--muted);margin-top:8px}
.buybox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 90px);display:grid;gap:16px}
.buybox h1{font-size:clamp(2rem,4vw,3rem);margin:0}
.buybox h1 small{display:block;font-family:var(--f-label);font-weight:600;font-size:.9rem;letter-spacing:.14em;color:var(--muted);margin-bottom:6px}
.pricebox{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);padding:18px 20px;display:grid;gap:12px}
.pricebox .price{font-size:2.8rem}
.pricebox .fine{font-size:.8rem;color:var(--muted)}
.savings{display:inline-block;background:var(--accent);color:var(--accent-ink);font-family:var(--f-label);font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;margin-left:8px;vertical-align:middle}
.facts{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)}
.facts div{padding:10px 14px;border-bottom:1px solid var(--line);display:grid;min-width:0}
.facts div:nth-child(odd){border-right:1px solid var(--line)}
.facts div:nth-last-child(-n+2){border-bottom:0}
.facts span{font-family:var(--f-label);font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:.7rem;color:var(--muted)}
.facts b{font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .btn{grid-column:1/-1}
.detail-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:32px;padding-bottom:50px}
.detail-grid h2{font-size:2rem;margin:0 0 14px}
.specs{width:100%;border-collapse:collapse;font-size:.95rem}
.specs th,.specs td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.specs th{font-family:var(--f-label);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;width:42%}
.desc{color:var(--fg-2);max-width:65ch;white-space:pre-line;margin:0 0 28px}
@media (max-width:960px){.unit,.detail-grid{grid-template-columns:1fr}.buybox{position:static}}

/* Calculator + lead form */
.box{background:var(--panel);border:1px solid var(--line);padding:22px;display:grid;gap:14px}
.box h3{margin:0;font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:1.5rem;line-height:1}
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc-out{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
.calc-out div{background:var(--bg-2);padding:12px 14px;display:grid}
.calc-out b{font-family:var(--f-display);font-weight:800;font-size:1.9rem;line-height:1.05;font-variant-numeric:tabular-nums}
.calc-out div:first-child b{color:var(--accent-txt)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs label{cursor:pointer}
.tabs input{position:absolute;opacity:0;pointer-events:none}
.tabs span{display:block;text-align:center;padding:10px 6px;border:1.5px solid var(--line-2);font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.78rem;border-radius:var(--r);line-height:1.2}
.tabs input:checked + span{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tabs input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid .full{grid-column:1/-1}
.success{border:1px solid var(--ok);background:rgba(62,196,109,.08);padding:18px;display:grid;gap:6px}
.success b{font-family:var(--f-display);font-weight:800;font-size:1.4rem;text-transform:uppercase}
.fine-print{font-size:.78rem;color:var(--muted);margin:0}
@media (max-width:520px){.form-grid,.calc-grid{grid-template-columns:1fr}}

.content{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;padding-block:36px 60px;align-items:start}
.content p{color:var(--fg-2);max-width:62ch}
.tiers{display:grid;gap:8px}
.tiers div{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);background:var(--panel)}
.tiers b{font-family:var(--f-display);font-size:1.3rem;font-weight:800;color:var(--accent-txt)}
@media (max-width:900px){.content{grid-template-columns:1fr}}

/* ===== Admin ===== */
.admin{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;background:var(--bg-2)}
.side{background:var(--bg);border-right:1px solid var(--line);padding:20px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.side .logo{padding:4px 6px 18px;border-bottom:1px solid var(--line);margin-bottom:10px}
.side a,.side button{display:flex;align-items:center;gap:10px;padding:10px 12px;text-decoration:none;color:var(--fg-2);font-weight:600;border-radius:var(--r);background:none;border:0;cursor:pointer;text-align:left;width:100%}
.side a:hover,.side button:hover{background:var(--panel);color:var(--fg)}
.side a[aria-current="page"]{background:var(--panel-2);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
.side .count{margin-left:auto;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:10px}
.side .sp{flex:1}
.side .demo-note{font-size:.76rem;color:var(--muted);padding:10px 12px;border:1px dashed var(--line-2);border-radius:var(--r);line-height:1.4}
.admin-main{min-width:0;padding:26px 28px 60px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.admin-top{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.admin-top h1{margin:0;font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:2.4rem;line-height:1}
.admin-top p{margin:4px 0 0;color:var(--muted)}
.admin-mobile-bar{display:none}
@media (max-width:860px){
  .admin{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line)}
  .side .logo,.side .sp,.side .demo-note{display:none}
  .side a,.side button{width:auto;padding:8px 10px;font-size:.9rem}
  .admin-main{padding:20px 16px 50px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);padding:14px 16px;display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1.05;font-variant-numeric:tabular-nums}
.stat.warn b{color:var(--warn)}
.stat.hot b{color:var(--accent)}
@media (max-width:1100px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.stats{grid-template-columns:1fr 1fr}}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .input{width:auto;min-width:0}
.toolbar .grow{flex:1;min-width:180px}
.bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--accent);color:var(--accent-ink);padding:10px 12px;margin-bottom:12px}
.bulk b{font-family:var(--f-display);font-weight:800;font-size:1.15rem;margin-right:6px}
.bulk .btn-line{border-color:rgba(23,9,0,.35);color:var(--accent-ink)}
.bulk .btn-line:hover{background:rgba(23,9,0,.1);border-color:var(--accent-ink)}
.bulk .input{background:#fff3ea;color:#170900;border-color:rgba(23,9,0,.3);min-height:36px;padding:.35em .55em;width:90px}
.bulk select.input{width:auto}
.table-wrap{overflow-x:auto;border:1px solid var(--line);background:var(--panel)}
table.inv-t{width:100%;border-collapse:collapse;min-width:980px}
.inv-t th{font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg-2);white-space:nowrap}
.inv-t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.inv-t tr:last-child td{border-bottom:0}
.inv-t tr.sel td{background:rgba(255,106,19,.07)}
.inv-t tr.is-sold td:not(:first-child):not(:last-child){opacity:.6}
.inv-t .thumb{width:84px;height:54px;background:#15171a;border:1px solid var(--line);overflow:hidden;position:relative}
.inv-t .thumb svg{width:100%;height:100%}
.inv-t .thumb img{width:100%;height:100%;object-fit:cover}
.inv-t .ttl{font-weight:700;line-height:1.25}
.inv-t .sub{font-size:.8rem;color:var(--muted);font-family:var(--f-label)}

function load(){

function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); return true; }

}
const DB = {
  units: () => S.units,
  unit: id => S.units.find(u => u.id === id),
  saveUnit(u){ const i = S.units.findIndex(x => x.id === u.id); if(i >= 0) S.units[i] = u; else S.units.unshift(u); return persist(); },
  deleteUnits(ids){ S.units = S.units.filter(u => !ids.includes(u.id)); return persist(); },
  leads: () => S.leads,
  addLead(l){ S.leads.unshift(l); return persist(); },
  updateLead(id, patch){ Object.assign(S.leads.find(l => l.id === id) || {}, patch); return persist(); },
  settings: () => S.settings,
  saveSettings(s){ S.settings = Object.assign(S.settings, s); return persist(); },
  reset(){ S = seed(); persist(); }

const money = n => CAD.format(Math.round(n || 0));
const num = n => new Intl.NumberFormat('en-CA').format(n);
const catOf = id => CATS.find(c => c.id === id) || CATS[0];
const title = u => `${u.year} ${u.make} ${u.model}`;
const eff = u => (u.salePrice && u.salePrice < u.price) ? u.salePrice : u.price;
const uid = () => 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function pmt(principal, rate, months){ const r = rate/100/12; if(principal <= 0) return 0; if(!r) return principal/months; return principal*r/(1 - Math.pow(1+r, -months)); }
function biweekly(u){ const s = DB.settings(); return pmt(eff(u)*1.13, s.rate, s.term) * 12 / 26; }
function ago(t){ const m = Math.round((Date.now()-t)/60000); if(m < 60) return m + ' min ago'; const h = Math.round(m/60); if(h < 24) return h + ' hr ago'; const d = Math.round(h/24); return d + (d === 1 ? ' day ago' : ' days ago'); }
function isPublic(u){
  if(u.status === 'hidden') return false;
  if(u.status === 'sold') return u.soldAt && (Date.now() - u.soldAt) < DB.settings().soldDays * DAY;
  return true;
}
const inStock = () => DB.units().filter(u => u.status === 'available' || u.status === 'pending');
function ss(k, v){ try{ if(v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); }catch(e){ return null; } }

let memAuth = false;
const authed = () => memAuth || ss('bf_auth') === '1';

function toast(msg, bad){
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 3200);
}
function ask(heading, msg, yes, fn){
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = `<div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-h"><h3 id="dlg-h">${esc(heading)}</h3><p>${esc(msg)}</p>
    <div class="row"><button class="btn-line" data-no>Cancel</button><button class="btn sm" data-yes style="background:var(--bad);color:#fff">${esc(yes)}</button></div></div>`;
  document.body.appendChild(o);
  const close = () => o.remove();
  o.addEventListener('click', e => { if(e.target === o || e.target.hasAttribute('data-no')) close(); if(e.target.hasAttribute('data-yes')){ close(); fn(); } });
  o.querySelector('[data-no]').focus();
}

function landSVG(){
  let d = 'M0 400 L0 252', x = 0, seed = 11;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  while(x < 1460){ const w = 12 + rnd()*24, h = 16 + rnd()*44, b = 254 + Math.sin(x/170)*12;
    d += ` L${x.toFixed(0)} ${b.toFixed(0)} L${(x + w/2).toFixed(0)} ${(b - h).toFixed(0)} L${(x + w).toFixed(0)} ${b.toFixed(0)}`; x += w*.78; }

function filtered(){
  const q = F.q.trim().toLowerCase();
  let list = DB.units().filter(isPublic).filter(u =>
    (!F.cats.length || F.cats.includes(u.category)) &&
    (F.cond === 'all' || u.condition === F.cond) &&
    (!F.make || u.make === F.make) &&
    (!F.yearMin || u.year >= +F.yearMin) && (!F.yearMax || u.year <= +F.yearMax) &&
    (!F.priceMax || eff(u) <= F.priceMax) &&
    (!F.sale || (u.salePrice && u.salePrice < u.price)) &&
    (F.sold || u.status !== 'sold') &&
    (!q || `${title(u)} ${u.stock} ${u.colour} ${catOf(u.category).name}`.toLowerCase().includes(q)));
  const by = {featured:(a,b) => (b.featured - a.featured) || (b.createdAt - a.createdAt), newest:(a,b) => b.createdAt - a.createdAt,
    plow:(a,b) => eff(a) - eff(b), phigh:(a,b) => eff(b) - eff(a), year:(a,b) => b.year - a.year};
  list.sort(by[F.sort] || by.featured);
  list.sort((a,b) => (a.status === 'sold') - (b.status === 'sold'));
  return list;
}
function renderResults(){
  const list = filtered(), el = $('#results'); if(!el) return;
  $('#res-count').textContent = list.length;
  el.innerHTML = list.length ? list.map(card).join('') : `<div class="empty" style="grid-column:1/-1">Nothing matches those filters. <button class="btn-line sm" data-act="reset-f" style="margin-left:8px">Reset filters</button></div>`;
}

function runCalc(idp){
  const g = id => $('#' + idp + id); if(!g('c-price')) return;
  const principal = (+g('c-price').value * (g('c-tax').checked ? 1.13 : 1)) - (+g('c-down').value || 0);
  const mo = pmt(principal, +g('c-rate').value || 0, +g('c-term').value);
  g('c-mo').textContent = money(mo); g('c-bw').textContent = money(mo * 12 / 26);
}

async function addFiles(files){

function shrink(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const s = Math.min(1, 1200 / img.width), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); res(cv.toDataURL('image/jpeg', .76)); };
      img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

const CSV_COLS = ['stock','year','make','model','category','condition','price','sale_price','status','colour','km','hours','vin','featured','description'];
function toCSV(){
  const q = v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  return [CSV_COLS.join(',')].concat(DB.units().map(u => [u.stock,u.year,u.make,u.model,u.category,u.condition,u.price,u.salePrice,u.status,u.colour,u.km,u.hours,u.vin,u.featured ? 'yes' : 'no',u.description].map(q).join(','))).join('\n');
}
function parseCSV(t){
  const rows = []; let row = [], f = '', q = false;
  for(let i = 0; i < t.length; i++){
    const c = t[i];
    if(q){ if(c === '"' && t[i+1] === '"'){ f += '"'; i++; } else if(c === '"') q = false; else f += c; }
    else if(c === '"') q = true; else if(c === ',') { row.push(f); f = ''; }
    else if(c === '\n' || c === '\r'){ if(c === '\r' && t[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if(f || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}

function startDust(intro){
  const cv = $('#dust'); if(!cv || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ctx = cv.getContext('2d'); let w, h, raf, ps = [];
  const size = () => { const r = cv.getBoundingClientRect(); w = cv.width = r.width; h = cv.height = r.height; };
  size();
  for(let i = 0; i < 70; i++) ps.push({x:Math.random()*w, y:h*.45 + Math.random()*h*.55, r:Math.random()*2.2+.4, v:Math.random()*.6+.15, a:Math.random()*.5+.1, d:Math.random()*Math.PI*2});
  const burst = () => {
    const ride = $('.hero-art .ride'); if(!ride) return;
    const cr = cv.getBoundingClientRect(), ar = ride.getBoundingClientRect();
    [[.80, 70, 1], [.24, 30, .6]].forEach(([fx, n, k]) => {
      const x = ar.left - cr.left + ar.width*fx, y = ar.top - cr.top + ar.height*.9;
      for(let i = 0; i < n; i++) ps.push({b:1, x:x + (Math.random()-.5)*40, y:y - Math.random()*10, vx:(Math.random()*6 + 1.5)*k, vy:-(Math.random()*3.2 + .4)*k,
        r:Math.random()*5 + 2, a:Math.random()*.35 + .35});
    });
  };
  dustBurst = burst;
  // emit dust at a viewport point, drifting along (dx, dy) in px/frame
  dustAt = (clientX, clientY, n, dx, dy, size = 1) => {
    const cr = cv.getBoundingClientRect(), x = clientX - cr.left, y = clientY - cr.top;
    for(let i = 0; i < n; i++) ps.push({b:1, x:x + (Math.random()-.5)*14*size, y:y - Math.random()*6, vx:dx*(0.6 + Math.random()*.8) + (Math.random()-.5)*1.2,
      vy:dy*(0.6 + Math.random()*.8) - Math.random()*1.4*size, r:(Math.random()*3 + 1.5)*size, a:Math.random()*.25 + .2});
  };
  const tick = () => {
    ctx.clearRect(0,0,w,h);
    ps = ps.filter(p => !p.b || p.a > .02);
    for(const p of ps){
      if(p.b){ p.x += p.vx; p.y += p.vy; p.vx *= .95; p.vy = p.vy*.95 + .03; p.r *= 1.012; p.a *= .968;
        ctx.fillStyle = `rgba(196,150,104,${p.a})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); continue; } p.x -= p.v; p.d += .01; p.y += Math.sin(p.d)*.15; if(p.x < -5){ p.x = w + 5; p.y = h*.45 + Math.random()*h*.55; }
      ctx.fillStyle = `rgba(214,170,120,${p.a})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
    raf = requestAnimationFrame(tick);
  };
  tick(); window.addEventListener('resize', size);
  dustStop = () => { cancelAnimationFrame(raf); window.removeEventListener('resize', size); dustBurst = null; dustAt = null; };
}

/* ---------- 3D hero ATV ---------- */
let heroStop = null, dustBurst = null, dustAt = null, threeReady = null, modelReady = null;
function loadScript(src){
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
function loadThree(){
  if(!threeReady) threeReady = loadScript(THREE_BASE + 'build/three.min.js').then(() => Promise.all([
    loadScript(THREE_BASE + 'examples/js/loaders/GLTFLoader.js'), loadScript(THREE_BASE + 'examples/js/environments/RoomEnvironment.js')]));
  return threeReady;
}
function loadModel(){
  // The model ships as a base64 GLB inside a JSON file: the page may fetch its own files, but not data: or blob: URLs,
  // so the loader parses the bytes directly and textures load through <img> (TextureLoader) instead of fetch.
  if(!modelReady) modelReady = Promise.all([loadThree(), fetch(MODEL_URL).then(r => { if(!r.ok) throw new Error('model ' + r.status); return r.json(); })])
    .then(([, j]) => new Promise((res, rej) => {
      const bin = atob(j.data), bytes = new Uint8Array(bin.length);
      for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      THREE.ImageBitmapLoader = THREE.TextureLoader;
      new THREE.GLTFLoader().parse(bytes.buffer, '', res, rej);
    }));
  modelReady.catch(() => { modelReady = null; threeReady = null; });
  return modelReady;
}
function webglOK(){ try{ const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); }catch(e){ return false; } }

function startHero3D(intro){
  const ride = $('.hero-art .ride'); if(!ride) return;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let stopped = false, fellBack = false, raf = 0, cleanup = () => {};
  const svgDrive = () => { fellBack = true; ride.classList.remove('waiting'); if(intro){ ride.classList.add('svg-drive'); setTimeout(() => dustBurst && dustBurst(), 640); } };
  if(HERO_IMG || !webglOK()){ svgDrive(); return; }
  if(intro) ride.classList.add('waiting');
  const fallbackT = intro ? setTimeout(() => { if(!ride.classList.contains('has3d')) svgDrive(); }, 3000) : 0;
  heroStop = () => { stopped = true; clearTimeout(fallbackT); cancelAnimationFrame(raf); cleanup(); };

  loadModel().then(gltf => {
    if(stopped || fellBack || !document.body.contains(ride)) return;
    clearTimeout(fallbackT);
    const canvas = document.createElement('canvas');
    canvas.setAttribute('role', 'img'); canvas.setAttribute('aria-label', 'Sport ATV');
    ride.appendChild(canvas);
    const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.2;
    const scene = new THREE.Scene();
    const pm = new THREE.PMREMGenerator(renderer);
    const env = pm.fromScene(new THREE.RoomEnvironment(), 0.04).texture; scene.environment = env;
    scene.add(new THREE.HemisphereLight(0xffffff, 0x2a1a10, .5));
    const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(-3, 4, 4); scene.add(key);
    const rim = new THREE.DirectionalLight(0xff7a2e, 3.2); rim.position.set(4, 2, -3); scene.add(rim);

    // Rig: body mesh + four wheels, each wheel on its hub inside a steer node (see atv-model.json 'rig').
    const model = gltf.scene;
    const part = n => model.getObjectByName(n);
    const bodyMesh = part('body');
    const WHEELS = [['fl', .272], ['fr', .272], ['rl', .287], ['rr', .287]].map(([k, r]) => ({k, r, steer: part('steer_' + k), wheel: part('wheel_' + k), phase: Math.random() * 6.28}));
    if(!bodyMesh || WHEELS.some(w => !w.steer || !w.wheel)) throw new Error('model rig missing');
    WHEELS.forEach(w => { w.base = w.steer.position.clone(); if(w.k[0] === 'f') w.base.y -= .045; });   // front tyres down onto the ground
    const box = new THREE.Box3().setFromObject(model);
    model.position.y = -box.min.y;                                      // tyres on y = 0
    const car = new THREE.Group(); car.add(model); scene.add(car);     // car = ground position + heading
    // soft contact shadow rides with the car
    const sc = document.createElement('canvas'); sc.width = sc.height = 128;
    const sx = sc.getContext('2d'), gr = sx.createRadialGradient(64,64,4,64,64,62);
    gr.addColorStop(0, 'rgba(0,0,0,.75)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); sx.fillStyle = gr; sx.fillRect(0,0,128,128);
    const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 2.6), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc), transparent:true, depthWrite:false}));
    shadow.rotation.x = -Math.PI/2; shadow.position.y = .003; car.add(shadow);

    const cam = new THREE.PerspectiveCamera(26, 5/3, .1, 100);
    const size = () => {
      const w = ride.clientWidth, h = ride.clientHeight || w*.6;
      const extra = Math.max(0, Math.round(document.documentElement.clientWidth - ride.getBoundingClientRect().right));
      canvas.style.width = (w + extra) + 'px';                         // spill to the screen edge on the right
      renderer.setSize(w + extra, h, false);
      cam.aspect = (w + 2 * extra) / h;                               // virtual frame centred on the original view
      cam.setViewOffset(w + 2 * extra, h, extra, 0, w + extra, h);    // render its right-hand part: same framing, wider stage
      cam.updateProjectionMatrix();
    };
    size();
    let px = 0, py = 0, cx = 0, cy = 0;
    const onMove = e => { px = (e.clientX / innerWidth - .5) * 2; py = (e.clientY / innerHeight - .5) * 2; };
    window.addEventListener('resize', size); window.addEventListener('pointermove', onMove);
    cleanup = () => { window.removeEventListener('resize', size); window.removeEventListener('pointermove', onMove); renderer.dispose(); env.dispose(); pm.dispose(); };

    /* ---- drive path: enters side-on from the right, brakes hard and turns in to face the viewer ---- */
    const YAW = -1.0, YAW0 = -1.57, DIST = 6.4, DUR = 1750, N = 400, WB = 1.43;
    const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
    const path = [];                                                    // samples of s, heading, x, z over normalised time
    { let x = 0, z = 0, prevS = 0;
      for(let i = 0; i <= N; i++){
        const t = i / N, sN = 1 - Math.pow(1 - t, 2.3), s = sN * DIST;  // speed falls off steeply: hard braking at the end
        const head = YAW0 + (YAW - YAW0) * smooth(.5, .97, t);
        const ds = s - prevS; x += Math.sin(head) * ds; z += Math.cos(head) * ds; prevS = s;
        path.push({t, s, head, x, z});
      }
      const end = path[N]; path.forEach(p => { p.x -= end.x; p.z -= end.z; });
    }
    const sample = t => { const f = Math.max(0, Math.min(1, t)) * N, i = Math.min(N - 1, Math.floor(f)), u = f - i, a = path[i], b = path[i + 1];
      return {s: a.s + (b.s - a.s) * u, head: a.head + (b.head - a.head) * u, x: a.x + (b.x - a.x) * u, z: a.z + (b.z - a.z) * u}; };

    // second-order springs = suspension (underdamped: dive, rebound, settle)
    const spring = (k, c) => ({v: 0, x: 0, k, c, step(target, dt){ this.v += (this.k * (target - this.x) - this.c * this.v) * dt; this.x += this.v * dt; return this.x; }});
    const pitchS = spring(140, 9), rollS = spring(120, 9), heaveS = spring(160, 11), steerS = spring(90, 14);
    const v3 = new THREE.Vector3(), v3b = new THREE.Vector3();
    let elapsed = 0, last = 0, prevS = intro ? 0 : DIST, prevV = 0, prevHead = intro ? YAW0 : YAW, burstDone = !intro, trailT = 0;
    const toScreen = (obj, out) => { obj.getWorldPosition(out); out.project(cam); const r = renderer.domElement.getBoundingClientRect();
      return [r.left + (out.x * .5 + .5) * r.width, r.top + (-out.y * .5 + .5) * r.height]; };

    const frame = now => {
      const dtMs = last ? Math.min(now - last, 34) : 16; last = now; elapsed += dtMs;  // capped step: a slow first frame never skips the drive
      const dt = dtMs / 1000;
      const t = intro ? elapsed / DUR : 2;
      const p = sample(t);
      const v = Math.max(0, (p.s - prevS) / dt), acc = (v - prevV) / dt, yawRate = (p.head - prevHead) / dt;
      const moving = Math.min(1, v / 3);

      // ground position + heading (+ a little drift into the slide at the end)
      const drift = intro ? .16 * Math.sin(Math.PI * smooth(.62, 1, t)) * (1 - smooth(.9, 1.1, t)) : 0;
      const idleYaw = reduce ? 0 : Math.sin(now / 2600) * .04;
      cx += (px - cx) * .05; cy += (py - cy) * .05;
      car.position.set(p.x, 0, p.z);
      car.rotation.y = p.head - drift + (t >= 1 ? idleYaw + cx * .3 : 0);

      // wheels roll by distance travelled; fronts steer into the turn
      const ds = p.s - prevS;
      const steerTarget = v > .15 ? Math.max(-.5, Math.min(.5, Math.atan(WB * yawRate / v))) : 0;
      const steerA = steerS.step(steerTarget, dt);
      for(const w of WHEELS){
        w.wheel.rotation.x += ds / w.r;
        if(w.k[0] === 'f') w.steer.rotation.y = steerA;
        // each wheel follows the ground on its own (small terrain bumps while moving)
        w.steer.position.copy(w.base); w.steer.position.y += moving * .014 * Math.sin(p.s * 6.5 + w.phase) * Math.sin(p.s * 2.3 + w.phase * .7);
      }

      // body on the suspension: dive under braking, lean in the turn, heave over bumps, idle shudder at rest
      const bump = moving * (.012 * Math.sin(p.s * 6.5) + .008 * Math.sin(p.s * 11.3 + 1.1));
      const pitch = pitchS.step(Math.max(-.05, Math.min(.11, -acc * .0062)), dt);
      const roll = rollS.step(Math.max(-.08, Math.min(.08, -v * yawRate * .02)), dt);
      const heave = heaveS.step(bump - Math.max(0, pitch) * .12, dt);
      const shudder = t >= .98 && !reduce ? .0016 * Math.sin(now * .19) + .0009 * Math.sin(now * .43) : 0;
      bodyMesh.rotation.set(pitch, 0, roll + shudder * .6);
      bodyMesh.position.y = heave + shudder;

      // dirt: trail off the rear tyres while moving, burst when the brakes bite
      if(dustAt && intro && t < 1){
        trailT += dtMs;
        if(v > 1.2 && trailT > 30){ trailT = 0;
          for(const w of WHEELS.filter(w => w.k[0] === 'r')){ const [sx2, sy2] = toScreen(w.wheel, v3); dustAt(sx2, sy2 + 18, 2, 1.6 * moving, -.2, .8 + moving * .5); }
        }
        if(!burstDone && t > .78){ burstDone = true;
          for(const w of WHEELS){ const [sx2, sy2] = toScreen(w.wheel, v3b); dustAt(sx2, sy2 + 20, w.k[0] === 'r' ? 26 : 14, 2.4, -.6, 1.2); }
          dustBurst && dustBurst();
        }
      }
      prevS = p.s; prevV = v; prevHead = p.head;

      cam.position.set(0, .95 - cy * .3, 4.4); cam.lookAt(0, .48, 0);
      renderer.render(scene, cam);
      raf = requestAnimationFrame(frame);
    };
    if(intro) canvas.style.transition = 'none';
    // compile shaders and draw the start pose before revealing, so the drive-in starts clean
    { const p0 = sample(intro ? 0 : 1); car.position.set(p0.x, 0, p0.z); car.rotation.y = p0.head; WHEELS.forEach(w => w.steer.position.copy(w.base)); }
    cam.position.set(0, .95, 4.4); cam.lookAt(0, .48, 0);
    renderer.compile(scene, cam); renderer.render(scene, cam);
    ride.classList.remove('waiting'); ride.classList.add('has3d');
    raf = requestAnimationFrame(frame);
  }).catch(() => { clearTimeout(fallbackT); if(!stopped && !fellBack) svgDrive(); });
}

    case 'reset-f': resetF(); render(); break;
    case 'filters': $('#filters').classList.toggle('show'); break;
    case 'gal': { galIdx = +t.dataset.i; const un = DB.unit(location.hash.slice(6)); const gi = $('#gal-main img'); gi.src = un.photos[galIdx]; gi.classList.toggle('cut', isCut(un.photos[galIdx])); $$('.thumbs button').forEach((b,i) => b.setAttribute('aria-current', i === galIdx)); break; }
    case 'leadtab': { e.preventDefault(); const r = $(`#lead-form input[name=type][value=${t.dataset.v}]`); if(r){ r.checked = true; r.dispatchEvent(new Event('change', {bubbles:true})); } $('#lead-form').scrollIntoView({behavior:'smooth', block:'start'}); setTimeout(() => $('#lf-name')?.focus({preventScroll:true}), 400); break; }
    case 'logout': memAuth = false; ss('bf_auth', '0'); go('home'); break;
    case 'feature': u.featured = !u.featured; DB.saveUnit(u); renderAdminRows(); toast(u.featured ? 'Featured on the homepage.' : 'Removed from the homepage.'); break;
    case 'sold': setStatus(u, 'sold'); DB.saveUnit(u); renderAdminRows(); toast(`#${u.stock} marked sold.`); break;
    case 'relist': setStatus(u, 'available'); DB.saveUnit(u); renderAdminRows(); toast(`#${u.stock} is back on the site.`); break;
    case 'bulk': {
      const ids = [...selected];
      ids.forEach(i => { const x = DB.unit(i); if(t.dataset.v === 'feature') x.featured = true; else setStatus(x, t.dataset.v); });
      persist(); renderAdminRows(); toast(`${ids.length} unit${ids.length > 1 ? 's' : ''} updated.`); break;
    }
    case 'bulk-price': {
      const dir = +$('#bulk-dir').value, amt = +$('#bulk-amt').value || 0, pct = $('#bulk-unit').value === 'pct', mode = $('#bulk-mode').value;
      selected.forEach(i => { const x = DB.unit(i); const base = x.price; let np = pct ? base * (1 + dir*amt/100) : base + dir*amt; np = Math.max(0, Math.round(np));
        if(mode === 'sale'){ x.salePrice = np < x.price ? np : null; } else { x.price = np; if(x.salePrice && x.salePrice >= np) x.salePrice = null; } });
      persist(); renderAdminRows(); toast(mode === 'sale' ? 'Sale prices applied.' : 'Prices updated.'); break;
    }
    case 'bulk-clear-sale': selected.forEach(i => DB.unit(i).salePrice = null); persist(); renderAdminRows(); toast('Sale prices cleared.'); break;
    case 'bulk-delete': { const ids = [...selected]; ask('Delete units?', `This removes ${ids.length} unit${ids.length > 1 ? 's' : ''} from the website and the portal. This can't be undone.`, 'Delete', () => { DB.deleteUnits(ids); selected.clear(); renderAdminRows(); toast('Deleted.'); }); break; }
    case 'bulk-none': selected.clear(); renderAdminRows(); break;
    case 'delete-unit': ask('Delete this unit?', 'It comes off the website right away. This can\'t be undone.', 'Delete', () => { DB.deleteUnits([draft.id]); draft = null; go('admin'); toast('Unit deleted.'); }); break;
    case 'cancel-edit': draft = null; break;
    case 'spec-add': readDraft(); draft.specs.push(['','']); renderSpecs(); $(`#sk-${draft.specs.length-1}`).focus(); break;
    case 'spec-del': readDraft(); draft.specs.splice(+t.dataset.i, 1); renderSpecs(); break;
    case 'ph-left': case 'ph-right': case 'ph-cover': case 'ph-del': {
      const i = +t.dataset.i, p = draft.photos;
      if(a === 'ph-del') p.splice(i, 1);
      if(a === 'ph-cover') p.unshift(p.splice(i, 1)[0]);
      if(a === 'ph-left' && i > 0) [p[i-1], p[i]] = [p[i], p[i-1]];
      if(a === 'ph-right' && i < p.length - 1) [p[i+1], p[i]] = [p[i], p[i+1]];
      renderPhotos(); renderPreview(); break;
    }
    case 'csv-copy': { const ta = $('#csv-out'); navigator.clipboard?.writeText(ta.value).then(() => toast('Copied.'), () => { ta.select(); toast('Press Ctrl+C to copy.'); }) ?? (ta.select(), toast('Press Ctrl+C to copy.')); break; }
    case 'csv-preview': {
      const rows = parseCSV($('#csv-in').value.trim()); const res = $('#csv-result'); pendingImport = null; $('#csv-go').hidden = true;
      if(rows.length < 2){ res.innerHTML = '<p class="fine-print" style="color:var(--bad)">Add a header row and at least one unit.</p>'; break; }
      const head = rows[0].map(x => x.trim().toLowerCase());
      if(!head.includes('stock') || !head.includes('price')){ res.innerHTML = '<p class="fine-print" style="color:var(--bad)">The header row needs at least "stock" and "price" columns.</p>'; break; }
      const items = rows.slice(1).map(r => Object.fromEntries(head.map((h,i) => [h, (r[i] || '').trim()]))).filter(o => o.stock);
      const upd = items.filter(o => DB.units().some(x => x.stock === o.stock)).length;
      pendingImport = items; $('#csv-go').hidden = false;
      res.innerHTML = `<p style="margin:0">Found <b>${items.length}</b> units: <b>${items.length - upd}</b> new, <b>${upd}</b> updates.</p>`; break;
    }
    case 'csv-import': {
      if(!pendingImport) break;
      pendingImport.forEach(o => {
        let x = DB.units().find(z => z.stock === o.stock);
        if(!x){ x = {id:uid(), photos:[], specs:[], createdAt:Date.now(), soldAt:null, status:'available', featured:false, salePrice:null, km:null, hours:null, vin:'', description:'', colour:'Grey', condition:'New', category:'atvs', year:new Date().getFullYear(), make:'', model:''}; S.units.unshift(x); }
        const n = v => v === '' || v == null ? null : +String(v).replace(/[^\d.]/g, '');
        if(o.year) x.year = +o.year; if(o.make) x.make = o.make; if(o.model) x.model = o.model; x.stock = o.stock;
        if(o.category && CATS.some(c => c.id === o.category)) x.category = o.category;
        if(o.condition) x.condition = /used|pre/i.test(o.condition) ? 'Used' : 'New';
        if(o.price) x.price = n(o.price); if('sale_price' in o) x.salePrice = n(o.sale_price);
        if(o.status && ['available','pending','sold','hidden'].includes(o.status)) setStatus(x, o.status);
        if(o.colour && COLOURS[o.colour]) x.colour = o.colour; if('km' in o) x.km = n(o.km); if('hours' in o) x.hours = n(o.hours);
        if(o.vin) x.vin = o.vin; if(o.featured) x.featured = /^(y|yes|true|1)$/i.test(o.featured); if(o.description) x.description = o.description;
      });
      persist(); toast(`Imported ${pendingImport.length} units.`); pendingImport = null; go('admin'); break;
    }
    case 'reset-demo': ask('Reset demo data?', 'This puts back the sample inventory, leads and settings, and removes anything you added.', 'Reset', () => { DB.reset(); selected.clear(); draft = null; render(); toast('Demo data reset.'); }); break;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.f){
    const k = t.dataset.f;
    if(k === 'q'){ F.q = t.value; renderResults(); }
    if(k === 'priceMax'){ F.priceMax = +t.value >= +t.max ? 0 : +t.value; $('#pmax-out').textContent = F.priceMax ? money(F.priceMax) : 'Any'; renderResults(); }
  }
  if(t.hasAttribute('data-calc')) runCalc(t.id[0]);
  if(t.dataset.af === 'q'){ AF.q = t.value; renderAdminRows(); }
  if(t.closest('#unit-form') && !t.matches('#e-photos')){ readDraft(); renderPreview(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.f){
    const k = t.dataset.f;
    if(k === 'cat'){ F.cats = $$('[data-f="cat"]:checked').map(x => x.value); $$('.chip').forEach(c => c.setAttribute('aria-pressed', F.cats.length ? (F.cats.length === 1 && c.dataset.cat === F.cats[0]) : !c.dataset.cat)); }
    else if(k === 'sale' || k === 'sold') F[k] = t.checked;
    else if(k !== 'q' && k !== 'priceMax') F[k] = t.value;
    renderResults();
  }
  if(t.hasAttribute('data-calc')) runCalc(t.id[0]);
  if(t.hasAttribute('data-leadtype')){ const f = t.form; $$('[data-show]', f).forEach(x => x.hidden = x.dataset.show !== t.value); }
  if(t.dataset.af && t.dataset.af !== 'q'){ AF[t.dataset.af] = t.value; renderAdminRows(); }
  if(t.dataset.sel){ t.checked ? selected.add(t.dataset.sel) : selected.delete(t.dataset.sel); renderAdminRows(); }
  if(t.id === 'sel-all'){ adminList().forEach(u => t.checked ? selected.add(u.id) : selected.delete(u.id)); renderAdminRows(); }
  if(t.dataset.price){
    const u = DB.unit(t.dataset.price), v = Math.max(0, Math.round(+t.value || 0));
    if(v !== u.price){ u.price = v; if(u.salePrice && u.salePrice >= v) u.salePrice = null; DB.saveUnit(u); toast(`#${u.stock} price set to ${money(v)}. Live now.`); renderAdminRows(); }
  }
  if(t.dataset.status){ const u = DB.unit(t.dataset.status); setStatus(u, t.value); DB.saveUnit(u); toast(`#${u.stock} set to ${t.value}.`); renderAdminRows(); }
  if(t.dataset.lead){ DB.updateLead(t.dataset.lead, {status:t.value}); render(); }
  if(t.id === 'e-photos'){ addFiles(t.files); t.value = ''; }
  if(t.id === 'csv-file' && t.files[0]){ const fr = new FileReader(); fr.onload = () => { $('#csv-in').value = fr.result; $('[data-act="csv-preview"]').click(); }; fr.readAsText(t.files[0]); }
});
document.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.dataset.price){ e.preventDefault(); e.target.blur(); } });
['dragover','dragleave','drop'].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest && e.target.closest('#drop'); if(!z) return;
  e.preventDefault(); z.classList.toggle('over', ev === 'dragover');
  if(ev === 'drop') addFiles(e.dataTransfer.files);
}));

document.addEventListener('submit', e => {
  const f = e.target, kind = f.dataset.form; if(!kind) return;
  e.preventDefault();
  const fd = new FormData(f);
  if(kind === 'hsearch'){ resetF(); F.q = String(fd.get('q') || '').trim(); go('inventory'); window.scrollTo(0, 0); }
  if(kind === 'search'){
    resetF(); if(fd.get('cat')) F.cats = [fd.get('cat')]; F.cond = fd.get('cond'); F.make = fd.get('make'); F.priceMax = +fd.get('max');
    go('inventory'); window.scrollTo(0, 0);
  }
  if(kind === 'lead'){
    const u = fd.get('unitId') ? DB.unit(fd.get('unitId')) : null;
    const type = fd.get('type');
    const extra = [];
    if(type === 'ride' && fd.get('date')) extra.push('Preferred day: ' + fd.get('date'));
    if(type === 'trade' && (fd.get('tradeYM') || fd.get('tradeModel'))) extra.push(`Trade: ${fd.get('tradeYM') || ''} ${fd.get('tradeModel') || ''}${fd.get('tradeKm') ? ', ' + fd.get('tradeKm') : ''}`.trim());
    if(type === 'finance') extra.push(`Shopping for: ${fd.get('tradeYM')} · Budget: ${fd.get('tradeModel')}`);
    if(type === 'service') extra.push(`Machine: ${fd.get('tradeYM') || ''} ${fd.get('tradeModel') || ''} · ${fd.get('tradeKm')}${fd.get('pickup') ? ' · Needs pickup' : ''}`);
    DB.addLead({id:uid(), type, name:fd.get('name'), phone:fd.get('phone'), email:fd.get('email') || '', unitId:u ? u.id : '', unitTitle:u ? title(u) : '',
      message:fd.get('message') || '', extra:extra.join(' · '), created:Date.now(), status:'new'});
    const first = String(fd.get('name')).split(' ')[0];
    f.outerHTML = `<div class="success" id="lead-form" tabindex="-1"><b>Got it, ${esc(first)}.</b><span>A salesperson will call ${esc(fd.get('phone'))} within one business hour. Your request${u ? ' for #' + esc(u.stock) : ''} is now in the dealer portal under Leads.</span></div>`;
    $('#lead-form').focus();
  }
  if(kind === 'login'){
    if(fd.get('email') && fd.get('pw')){ memAuth = true; ss('bf_auth', '1'); render(); toast('Logged in.'); }
    else $('#app').innerHTML = loginPage('Enter your email and password.');
  }
  if(kind === 'unit'){
    readDraft();
    const d = draft;
    const missing = [!d.stock && 'stock #', !d.make && 'make', !d.model && 'model', !(+d.price > 0) && 'price'].filter(Boolean);
    if(missing.length){ toast('Add the ' + missing.join(', ') + ' before saving.', true); return; }
    if(DB.units().some(x => x.stock === d.stock && x.id !== d.id)){ toast(`Stock #${d.stock} is already used by another unit.`, true); return; }
    if(d.salePrice && d.salePrice >= d.price){ toast('Sale price must be lower than the regular price.', true); return; }
    const clean = Object.assign({}, d); delete clean._for; clean.price = +clean.price;
    clean.specs = clean.specs.filter(([k,v]) => k.trim() && v.trim());
    const isNew = !DB.unit(clean.id);
    if(!DB.saveUnit(clean)) return;
    draft = null;
    toast(isNew ? `#${clean.stock} published. It's live on the website.` : 'Saved. Changes are live on the website.');
    if(e.submitter && e.submitter.name === 'again') render(); else go('admin');
  }
  if(kind === 'settings'){
    DB.saveSettings({name:fd.get('name'), tagline:fd.get('tagline'), phone:fd.get('phone'), email:fd.get('email'), address:fd.get('address'), hours:fd.get('hours'),
      promoOn:!!fd.get('promoOn'), promo:fd.get('promo'), rate:+fd.get('rate'), term:+fd.get('term'), soldDays:+fd.get('soldDays')});
    render(); toast('Settings saved. The website is updated.');
  }
});

load();
render();
</script>
</body>
